name: Android APK
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - 'viewer.html'
      - 'examples/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AmpyStudio-1.0.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AmpyStudio-Android
          path: AmpyStudio-1.0.0-debug.apk
          if-no-files-found: error
