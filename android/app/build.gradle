plugins { id 'com.android.application' }
android {
    namespace 'com.ampybios.ampystudio'
    compileSdk 36
    defaultConfig {
        applicationId 'com.ampybios.ampystudio'
        minSdk 28
        targetSdk 36
        versionCode 4
        versionName '1.2.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets { main { assets.srcDir(layout.buildDirectory.dir('generated/studioAssets')) } }
}
tasks.register('syncStudioAssets', Copy) {
    from rootProject.file('../index.html')
    from rootProject.file('../viewer.html')
    from(rootProject.file('../examples')) { into 'examples' }
    into layout.buildDirectory.dir('generated/studioAssets')
}
tasks.named('preBuild').configure { dependsOn 'syncStudioAssets' }
