<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AmpyStudio · JSVG UI editor</title><link rel="stylesheet" href="studio.css"><body>
<header><div><b>AMPY<span>STUDIO</span></b><small>ORGANIC VECTOR DEVELOPMENT ENVIRONMENT / 1.0</small></div><div class="toolbar"><button id="new">New</button><button id="demo">Demo</button><label class="button">Open JSVG<input id="open" type="file" accept=".jsvg,.svg" hidden></label><button id="save">Save JSVG</button><button id="export">SVG</button></div></header>
<main><aside><h3>COMPONENTS</h3><div id="library"></div><h3>EXOGLYPH / 64</h3><div id="glyphs"></div><h3>LAYERS</h3><div id="layers"></div></aside><section class="work"><div class="toolbar"><button id="undo">Undo</button><button id="redo">Redo</button><button id="duplicate">Duplicate</button><button id="delete">Delete</button><button id="connect">Connect</button><button id="front">Layer +</button><button id="back">Layer −</button><button id="snap">Snap: off</button></div><div class="toolbar" id="viewTools" aria-label="Canvas view"><button id="zoomOut" aria-label="Zoom out">−</button><button id="zoomIn" aria-label="Zoom in">+</button><input id="canvasZoom" aria-label="Canvas zoom percent" type="range" min="25" max="600" step="5" value="100"><output id="zoomLabel">100%</output><button id="fitCanvas">Fit</button><button id="panMode">Pan: off</button><button id="uiSmaller" aria-label="Smaller interface text">A−</button><button id="uiLarger" aria-label="Larger interface text">A+</button><output id="uiSize">13px</output></div><div id="canvas"><svg id="stage" viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" stroke="#284137" fill="none" stroke-width=".7"/></pattern></defs><rect width="960" height="600" fill="#0a1819"/><rect width="960" height="600" fill="url(#grid)"/><g id="scene"></g><g id="selection" pointer-events="none"></g></svg></div><div class="toolbar"><button id="play">▶ Preview</button><button id="pause">Pause</button><button id="stop">Stop</button><button id="loop">Loop: on</button><button id="warning">Warning</button><button id="fault">Fault</button><button id="ack">ACK</button><button id="reset">Reset alarms</button><button id="flow">Change flow</button></div><div id="status" role="status">READY</div><h3>TIMELINE <span id="time">0.00 s</span></h3><input id="seek" type="range" min="0" max="1000" value="0"><div class="toolbar"><select id="track"><option>morph</option><option>scale</option><option>rotation</option><option>opacity</option><option>glow</option></select><input id="keyvalue" type="number" value="100" min="0" max="360"><button id="addkey">+ Keyframe</button><button id="delkey">− Keyframe</button><label>Duration s <input id="duration" type="number" min="1" max="60" value="6"></label></div><div id="tracks"></div></section><aside><h3>INSPECTOR</h3><div id="inspector"></div><h3>EVENT BINDING</h3><div id="events"></div><h3>JSVG METADATA</h3><pre id="metadata"></pre></aside></main><script src="engine.js"></script><script src="studio.js"></script></body></html>
